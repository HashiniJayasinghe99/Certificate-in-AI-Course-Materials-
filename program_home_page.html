<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate in Artificial Intelligence - Program Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#06b6d4',
                            600: '#0284c7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #080c14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.20) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.18) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.18) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.70);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(30, 41, 59, 0.70);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <main class="flex-grow flex flex-col items-center pt-20 pb-16 px-6 relative w-full max-w-5xl mx-auto">
        
        <!-- Header Section -->
        <header class="text-center space-y-4 mb-16 max-w-2xl">
            <div class="inline-flex items-center justify-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 via-blue-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-sm"></i>
                </div>
                <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">
                    Certificate in Artificial Intelligence
                </span>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-100 to-slate-300 leading-tight">
                Program Home
            </h1>
            
            <p class="text-sm md:text-base text-slate-300 leading-relaxed">
                Open your module below. New modules unlock as the course progresses.
            </p>
        </header>

        <!-- Dynamic Module Grid -->
        <div id="module-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <!-- Cards will be injected here by JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-white/5 mt-auto">
        <p class="text-xs text-slate-500 font-medium">
            Certificate in Artificial Intelligence &copy; <span id="current-year"></span>
        </p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // To unlock a module change locked: true to locked: false
        const MODULES = [
            { code: "CAI01", name: "MODULE NAME HERE", lecturer: "LECTURER NAME HERE", description: "One line description here", link: "module1/index.html", locked: false },
            { code: "CAI02", name: "MODULE NAME HERE", lecturer: "LECTURER NAME HERE", description: "One line description here", link: "module2/index.html", locked: true },
            { code: "CAI03", name: "MODULE NAME HERE", lecturer: "LECTURER NAME HERE", description: "One line description here", link: "module3/index.html", locked: true },
            { code: "CAI04", name: "MODULE NAME HERE", lecturer: "LECTURER NAME HERE", description: "One line description here", link: "module4/index.html", locked: true }
        ];

        function renderModules() {
            const grid = document.getElementById('module-grid');
            grid.innerHTML = '';

            MODULES.forEach((mod, index) => {
                const moduleNum = index + 1;

                if (mod.locked) {
                    // Locked Card (div, not clickable via keyboard or mouse)
                    grid.innerHTML += `
                        <div class="glass-panel p-6 rounded-2xl flex flex-col h-full opacity-60 border border-slate-700/50 border-dashed relative">
                            <div class="absolute top-6 right-6 px-2.5 py-1 rounded-full bg-slate-800/80 border border-slate-600/50 text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5 shadow-lg">
                                <i class="fa-solid fa-lock"></i> Locked
                            </div>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 block">Module ${moduleNum} • ${mod.code}</span>
                            <h3 class="text-xl font-bold text-slate-400 mb-3">${mod.name}</h3>
                            <p class="text-xs text-slate-500 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-chalkboard-user"></i> ${mod.lecturer}
                            </p>
                            <p class="text-sm text-slate-500 flex-grow mb-6 leading-relaxed">${mod.description}</p>
                            <div class="w-full py-3 rounded-xl bg-slate-800/50 text-slate-500 text-sm font-semibold border border-slate-700/50 cursor-not-allowed flex justify-center items-center gap-2" title="Unlocks soon">
                                Coming Soon <i class="fa-solid fa-lock text-xs"></i>
                            </div>
                        </div>
                    `;
                } else {
                    // Unlocked Card (anchor tag, fully interactive)
                    grid.innerHTML += `
                        <a href="${mod.link}" class="glass-card block p-6 rounded-2xl flex flex-col h-full group relative overflow-hidden transition-all duration-300 outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-[#080c14]">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-10 -mt-10 group-hover:bg-cyan-500/20 transition-all duration-500 ease-out"></div>
                            
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-1.5 block relative z-10">Module ${moduleNum} • ${mod.code}</span>
                            <h3 class="text-xl font-bold text-white mb-3 relative z-10">${mod.name}</h3>
                            <p class="text-xs text-slate-300 mb-4 flex items-center gap-2 relative z-10">
                                <i class="fa-solid fa-chalkboard-user text-cyan-500/70"></i> ${mod.lecturer}
                            </p>
                            <p class="text-sm text-slate-300 flex-grow mb-6 leading-relaxed relative z-10">${mod.description}</p>
                            
                            <div class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm font-semibold flex justify-center items-center gap-2 shadow-lg shadow-cyan-500/20 transition-all duration-300 relative z-10">
                                Open Module <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                            </div>
                        </a>
                    `;
                }
            });
        }

        // Initialize grid on load
        document.addEventListener('DOMContentLoaded', renderModules);
    </script>
</body>
</html>
